<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>a very serious question</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="flower-row" role="img" aria-label="a row of pixel flowers">
      <img class="bud" src="images/flower-bud.svg" alt="">
      <img class="tulip" src="images/flower-tulip.svg" alt="">
      <img class="daisy" src="images/flower-daisy.svg" alt="">
      <img class="tulip" src="images/flower-tulip.svg" alt="">
      <img class="bud" src="images/flower-bud.svg" alt="">
    </div>

    <div class="note">
      <span class="tape tape-left" aria-hidden="true"></span>
      <span class="tape tape-right" aria-hidden="true"></span>
      <h1 id="question">dear aiden - pioneer of trickle up economics... will u marry me now ! :-)</h1>
      <div class="buttons hidden" id="buttons">
        <button class="btn btn-yes" id="yes">yes</button>
        <button class="btn btn-no" id="no">no</button>
      </div>

      <!-- shown after "yes": me, saying something -->
      <div class="reply" id="reply" hidden>
        <p class="bubble" id="bubble">yay omg!!! :-)</p>
        <img class="me" src="images/me.jpg" alt="me, very happy">
      </div>
    </div>
  </main>

  <!-- intro: one tap opens the note and starts the music (browsers require a tap before sound) -->
  <button class="intro" id="intro">
    <img class="envelope" src="images/envelope.svg" alt="">
    <span>tap to open</span>
  </button>

  <!-- mute / unmute -->
  <button class="icon-btn sound-toggle" id="soundToggle" aria-label="mute music" hidden>🔊</button>

  <!-- start over from the envelope -->
  <button class="icon-btn restart" id="restart" aria-label="start over" hidden>↻</button>

  <!-- "I Root" by Michael Nau -->
  <audio id="song" src="music/i-root.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
